<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				@keyframes rotate {
					0% { transform: rotate(3deg); }
					100% { transform: rotate(-3deg); }
				}
				@keyframes fadeIn {
					0% { opacity: 0; }
					66% { opacity: 0.5; }
					100% { opacity: 1; }
				}
				.container {
					font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					margin: 0;
					width: 100%;
					height: 400px;
					background: linear-gradient(to right, #302b63, #24243e, #0f0c29);
					border-radius: 10px;
					color: white;
					text-align: center;
				}
				h1 {
					font-size: 50px;
					line-height: 1.3;
					letter-spacing: 5px;
					text-transform: uppercase;
					text-shadow: 0 1px 0 #efefef, 0 2px 0 #efefef, 0 3px 0 #efefef, 0 4px 0 #efefef, 0 12px 5px rgba(0,0,0,0.3);
					animation: rotate ease-in-out 1s infinite alternate;
					margin: 0 0 12px 0;
				}
				p {
					font-size: 22px;
					animation: 4s ease 0s normal forwards 1 fadeIn;
					color: #a78bfa;
					letter-spacing: 3px;
					margin: 0;
				}
			</style>
			<div class="container">
				<h1>Hi! I'm Naheel!</h1>
				<p>Full-Stack Developer &amp; Tech Enthusiast</p>
			</div>
		</div>
	</foreignObject>
</svg>
